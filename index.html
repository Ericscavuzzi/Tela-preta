<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Tela Preta</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
  }
  .quadrado {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    aspect-ratio: 1 / 1;
    background: #ffffff;
  }
</style>
</head>
<body><div class="quadrado"></div><span style="display:none">versao-3-quadrado</span></body>
</html>
