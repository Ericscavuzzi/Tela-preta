<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Transcritor de Voz</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    color: #ffffff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  /* ── Grade de 4 quadrados ── */
  #grade {
    height: 46%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;
    background: #000000;
    padding: 6px;
    flex-shrink: 0;
  }
  .quad {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    font-weight: 700;
    user-select: none;
  }
  #q3 { grid-column: 1; grid-row: 1; background: #21a55e; color: #ffffff; }
  #q4 { grid-column: 2; grid-row: 1; background: #f5c518; color: #000000; }
  #q2 { grid-column: 1; grid-row: 2; background: #2f6fed; color: #ffffff; }
  #q1 { grid-column: 2; grid-row: 2; background: #e0243c; color: #ffffff; }

  /* ── Retângulo estilo WhatsApp: mic + onda gravada ── */
  #painel {
    padding: 10px 8px 2px;
    flex-shrink: 0;
  }
  #caixaBotoes {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #141418;
    border: 1px solid #33333b;
    border-radius: 24px;
    padding: 8px 14px;
    width: 100%;
  }
  #mic {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid #ffffff;
    background: #000000;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, border-color .2s;
    flex-shrink: 0;
  }
  #mic svg { width: 22px; height: 22px; fill: #ffffff; }
  #mic.gravando {
    background: #e0243c;
    border-color: #e0243c;
    animation: pulso 1.2s infinite;
  }
  @keyframes pulso {
    0%   { box-shadow: 0 0 0 0 rgba(224,36,60,.55); }
    70%  { box-shadow: 0 0 0 12px rgba(224,36,60,0); }
    100% { box-shadow: 0 0 0 0 rgba(224,36,60,0); }
  }
  #onda {
    flex: 1;
    height: 46px;
    min-width: 0;
  }
  #tempo {
    font-size: 13px;
    color: #8a8a93;
    flex-shrink: 0;
    min-width: 38px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ── Idioma detectado ── */
  #idioma {
    padding: 6px 18px 0;
    font-size: 12px;
    color: #8a8a93;
    flex-shrink: 0;
  }
  #idioma b { color: #c9c9d2; font-weight: 600; }

  /* ── Mensagem remota ── */
  #mensagem {
    display: none;
    margin: 8px 14px 0;
    padding: 12px 14px;
    border: 1px solid #33333b;
    border-radius: 12px;
    font-size: 22px;
    line-height: 1.4;
    color: #ffffff;
    background: #16161c;
  }

  /* ── Célula editável da transcrição ── */
  #celula {
    flex: 1;
    margin: 8px 14px 14px;
    padding: 14px 16px;
    border: 1px solid #33333b;
    border-radius: 14px;
    background: #0e0e12;
    font-size: 20px;
    line-height: 1.5;
    overflow-y: auto;
    word-wrap: break-word;
    outline: none;
  }
  #celula:focus { border-color: #5a5a68; }
  #celula .parcial { color: #6e6e78; }
  #celula:empty::before {
    content: "O que você falar aparece aqui — toque pra editar…";
    color: #3a3a42;
    font-size: 15px;
  }
  #status {
    position: fixed;
    top: 0; left: 0; right: 0;
    text-align: center;
    padding: 10px;
    font-size: 13px;
    color: #ffffff;
    background: rgba(224,36,60,.92);
    display: none;
    z-index: 10;
  }
  #aviso {
    padding: 16px 20px;
    font-size: 15px;
    line-height: 1.5;
    color: #c9c9d2;
    display: none;
  }
</style>
</head>
<body>
  <div id="status"></div>
  <div id="grade">
    <div class="quad" id="q3">3</div>
    <div class="quad" id="q4">4</div>
    <div class="quad" id="q2">2</div>
    <div class="quad" id="q1">1</div>
  </div>
  <div id="painel">
    <div id="caixaBotoes">
      <button id="mic" title="Falar">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <canvas id="onda"></canvas>
      <span id="tempo">0:00</span>
    </div>
  </div>
  <div id="idioma">Idioma: <b id="idiomaNome">—</b></div>
  <div id="aviso"></div>
  <div id="mensagem"></div>
  <div id="celula" contenteditable="true" spellcheck="false"></div>
<script>
(function () {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var celula = document.getElementById('celula');
  var mic = document.getElementById('mic');
  var aviso = document.getElementById('aviso');
  var status = document.getElementById('status');
  var tempoEl = document.getElementById('tempo');
  var idiomaNome = document.getElementById('idiomaNome');
  var finalTexto = '';
  var ativo = false;
  var rec = null;
  var inicioGravacao = 0;
  var cronometro = null;

  /* ── Onda estilo WhatsApp (histórico de barras que fica gravado) ── */
  var canvas = document.getElementById('onda');
  var ctx2d = canvas.getContext('2d');
  var audioCtx = null, analyser = null, stream = null, raf = null, fake = false;
  var suave = 0, fase = 0;
  var ultimaFala = 0;
  // No celular, abrir o microfone duas vezes (onda + reconhecimento) deixa o
  // reconhecimento "surdo". Então no celular a onda anima pela atividade da fala.
  var MOVEL = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  function dimensionar() {
    canvas.width = canvas.clientWidth * (window.devicePixelRatio || 1);
    canvas.height = canvas.clientHeight * (window.devicePixelRatio || 1);
    desenhar();
  }
  window.addEventListener('resize', dimensionar);

  /* Ondas fluidas sobrepostas (estilo assistente de voz), em verde */
  var CURVAS = [
    { freq: 1.0, defas: 0.00, amp: 1.00, cor: 'rgba(37,211,102,0.95)',  esp: 2.0 },
    { freq: 1.5, defas: 1.10, amp: 0.70, cor: 'rgba(134,239,172,0.70)', esp: 1.6 },
    { freq: 0.8, defas: 2.30, amp: 0.85, cor: 'rgba(37,211,102,0.50)',  esp: 1.4 },
    { freq: 2.1, defas: 3.70, amp: 0.50, cor: 'rgba(22,163,74,0.55)',   esp: 1.2 }
  ];

  function atenuacao(x) {          // envelope: pico no centro, some nas pontas
    return Math.pow(4 / (4 + Math.pow(x, 4)), 2);
  }

  function desenhar() {
    var dpr = window.devicePixelRatio || 1;
    var W = canvas.width, H = canvas.height, meio = H / 2;
    ctx2d.clearRect(0, 0, W, H);
    var ampGlobal = Math.max(0.05, suave);
    ctx2d.shadowColor = 'rgba(37,211,102,0.55)';
    ctx2d.shadowBlur = 6 * dpr;
    for (var c = 0; c < CURVAS.length; c++) {
      var cv = CURVAS[c];
      ctx2d.beginPath();
      ctx2d.lineWidth = cv.esp * dpr;
      ctx2d.strokeStyle = cv.cor;
      var passos = 90;
      for (var i = 0; i <= passos; i++) {
        var p = i / passos;
        var x = p * W;
        var t = p * 4 - 2;         // -2 .. 2, centro no meio do canvas
        var y = meio + Math.sin(p * Math.PI * 4 * cv.freq + fase * (1 + c * 0.3) + cv.defas)
                * atenuacao(t) * ampGlobal * cv.amp * meio * 0.9;
        if (i === 0) ctx2d.moveTo(x, y); else ctx2d.lineTo(x, y);
      }
      ctx2d.stroke();
    }
    ctx2d.shadowBlur = 0;
  }

  function nivelAtual() {
    if (analyser && !fake) {
      var dados = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(dados);
      var soma = 0;
      for (var i = 0; i < dados.length; i++) {
        var v = (dados[i] - 128) / 128;
        soma += v * v;
      }
      var rms = Math.sqrt(soma / dados.length);
      return Math.min(1, rms * 3.2);
    }
    if (!ativo) return 0;
    // sem acesso direto ao mic: barras reagem à chegada de resultados da fala
    var falando = (Date.now() - ultimaFala) < 900;
    return falando ? 0.18 + Math.random() * 0.62 : 0.02 + Math.random() * 0.06;
  }

  function loop() {
    suave = suave * 0.75 + nivelAtual() * 0.25;
    fase += 0.16 + suave * 0.3;          // fala mais alta = onda mais rápida
    desenhar();
    raf = requestAnimationFrame(loop);
  }

  function ligarOnda() {
    suave = 0;
    if (raf) cancelAnimationFrame(raf);
    if (MOVEL) {                          // celular: reconhecimento tem prioridade no mic
      fake = true;
      loop();
      return;
    }
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
        stream = s;
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var src = audioCtx.createMediaStreamSource(s);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.5;
        src.connect(analyser);
        fake = false;
        loop();
      }).catch(function () { fake = true; loop(); });
    } else {
      fake = true;
      loop();
    }
  }

  function desligarOnda() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    analyser = null;
    suave = 0;
    desenhar();                           // em repouso: linhas verdes quase planas
  }

  /* ── Cronômetro ── */
  function formatarTempo(seg) {
    var m = Math.floor(seg / 60), s = seg % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  /* ── Detecção de idioma (pelo texto transcrito) ── */
  var IDIOMAS = {
    'Português': ['que','não','nao','de','o','a','e','eu','você','voce','está','esta','com','para','uma','isso','sim','muito','bom','dia','fazer','pra','já','ja','então','entao','também','tambem','obrigado'],
    'Inglês':    ['the','and','you','is','to','of','it','that','what','this','have','are','for','with','my','your','hello','yes','not','do'],
    'Espanhol':  ['el','los','las','es','y','en','pero','yo','usted','muy','gracias','hola','cómo','como','está','esta','por','qué','pero','bueno','ahora'],
    'Francês':   ['le','les','et','je','vous','est','pas','une','dans','pour','avec','bonjour','oui','merci','c’est','tres','très'],
    'Italiano':  ['che','di','il','non','per','sono','una','ciao','grazie','molto','bene','come','questo','anche'],
    'Alemão':    ['der','die','das','und','ich','nicht','ist','ein','mit','für','ja','nein','danke','hallo','wie']
  };
  function detectarIdioma(txt) {
    var palavras = txt.toLowerCase().replace(/[.,!?;:]/g, ' ').split(/\s+/).filter(Boolean);
    if (palavras.length < 3) return null;
    var melhor = null, melhorPts = 0;
    for (var nome in IDIOMAS) {
      var lista = IDIOMAS[nome], pts = 0;
      for (var i = 0; i < palavras.length; i++) {
        if (lista.indexOf(palavras[i]) !== -1) pts++;
      }
      if (pts > melhorPts) { melhorPts = pts; melhor = nome; }
    }
    return (melhorPts / palavras.length >= 0.08) ? melhor : null;
  }
  function atualizarIdioma() {
    var d = detectarIdioma(finalTexto.slice(-400));
    idiomaNome.textContent = d || '—';
  }

  dimensionar();

  /* ── Transcrição ── */
  if (!SR) {
    aviso.style.display = 'block';
    aviso.textContent = 'Este navegador não suporta reconhecimento de voz. Tente abrir no Chrome (Android) ou no Safari (iPhone).';
    mic.style.opacity = '0.3';
    return;
  }

  function render(parcial) {
    celula.innerHTML = '';
    if (finalTexto) celula.appendChild(document.createTextNode(finalTexto));
    if (parcial) {
      var s = document.createElement('span');
      s.className = 'parcial';
      s.textContent = (finalTexto ? ' ' : '') + parcial;
      celula.appendChild(s);
    }
    celula.scrollTop = celula.scrollHeight;
  }

  // edições manuais na célula viram o novo texto oficial
  celula.addEventListener('input', function () {
    finalTexto = celula.innerText.replace(/ /g, ' ').trim();
    atualizarIdioma();
  });

  function criar() {
    var r = new SR();
    r.lang = 'pt-BR';
    r.continuous = true;
    r.interimResults = true;
    r.onresult = function (e) {
      ultimaFala = Date.now();
      var parcial = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          finalTexto = (finalTexto ? finalTexto + ' ' : '') + t.trim();
        } else {
          parcial += t;
        }
      }
      render(parcial.trim());
      atualizarIdioma();
    };
    r.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        parar();
        status.style.display = 'block';
        status.textContent = 'Permita o acesso ao microfone nas configurações do navegador.';
      } else if (e.error === 'audio-capture') {
        parar();
        status.style.display = 'block';
        status.textContent = 'Não consegui acessar o microfone. Feche outros apps que estejam usando ele e tente de novo.';
      } else if (e.error === 'network') {
        status.style.display = 'block';
        status.textContent = 'Sem conexão com o serviço de voz. Verifique a internet.';
      }
      // 'no-speech' e 'aborted' são normais: o reconhecimento religa sozinho
    };
    r.onend = function () {
      if (ativo) {
        setTimeout(function () {
          if (ativo) { try { r.start(); } catch (err) {} }
        }, 250);
      }
    };
    return r;
  }

  function iniciar() {
    status.style.display = 'none';
    celula.blur();
    rec = rec || criar();
    try { rec.start(); } catch (err) {}
    ativo = true;
    mic.classList.add('gravando');
    ligarOnda();
    inicioGravacao = Date.now();
    tempoEl.textContent = '0:00';
    cronometro = setInterval(function () {
      tempoEl.textContent = formatarTempo(Math.floor((Date.now() - inicioGravacao) / 1000));
    }, 500);
  }

  function parar() {
    ativo = false;
    mic.classList.remove('gravando');
    if (rec) { try { rec.stop(); } catch (err) {} }
    desligarOnda();
    if (cronometro) { clearInterval(cronometro); cronometro = null; }
  }

  mic.addEventListener('click', function () {
    ativo ? parar() : iniciar();
  });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script>
(function () {
  if (typeof mqtt === 'undefined') return;
  var TOPICO = 'ericscvz/tela-preta-k4d9/estado';
  var quads = { 1: 'q1', 2: 'q2', 3: 'q3', 4: 'q4' };
  var msg = document.getElementById('mensagem');

  function corDoTexto(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h.replace(/./g, function (c) { return c + c; });
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#000000' : '#ffffff';
  }

  function aplicar(estado) {
    if (estado.cores) {
      for (var n in quads) {
        var cor = estado.cores[n];
        if (cor) {
          var el = document.getElementById(quads[n]);
          el.style.background = cor;
          el.style.color = corDoTexto(cor);
        }
      }
    }
    if ('mensagem' in estado) {
      if (estado.mensagem) {
        msg.textContent = estado.mensagem;
        msg.style.display = 'block';
      } else {
        msg.style.display = 'none';
      }
    }
  }

  var c = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
    clientId: 'tela-' + Math.random().toString(16).slice(2, 10),
    clean: true,
    reconnectPeriod: 3000
  });
  c.on('connect', function () { c.subscribe(TOPICO); });
  c.on('message', function (t, payload) {
    try { aplicar(JSON.parse(payload.toString())); } catch (e) {}
  });
})();
</script>
<span style="display:none">versao-12-ondas</span>
</body>
</html>
