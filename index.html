<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Transcritor de Voz</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    color: #ffffff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  /* ── Grade de 4 quadrados (metade de cima) ── */
  #grade {
    height: 50%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;               /* as duas retas que dividem */
    background: #000000;
    padding: 6px;
  }
  .quad {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    font-weight: 700;
    user-select: none;
  }
  /* numeração: 1 = inferior direito, 2 = inferior esquerdo, 3 = superior esquerdo, 4 = superior direito */
  #q3 { grid-column: 1; grid-row: 1; background: #21a55e; color: #ffffff; } /* superior esquerdo */
  #q4 { grid-column: 2; grid-row: 1; background: #f5c518; color: #000000; } /* superior direito */
  #q2 { grid-column: 1; grid-row: 2; background: #2f6fed; color: #ffffff; } /* inferior esquerdo */
  #q1 { grid-column: 2; grid-row: 2; background: #e0243c; color: #ffffff; } /* inferior direito */

  /* ── Metade de baixo: transcrição ── */
  #texto {
    flex: 1;
    overflow-y: auto;
    padding: 14px 18px;
    font-size: 20px;
    line-height: 1.5;
    word-wrap: break-word;
  }
  #texto .parcial { color: #6e6e78; }
  #texto:empty::before {
    content: "Toque no microfone e fale — o texto aparece aqui…";
    color: #3a3a42;
    font-size: 16px;
  }
  footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 8px 0 22px;
  }
  .mini {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid #33333b;
    background: #141418;
    color: #b9b9c2;
    font-size: 18px;
    cursor: pointer;
  }
  #mic {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 2px solid #ffffff;
    background: #000000;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, border-color .2s;
  }
  #mic svg { width: 30px; height: 30px; fill: #ffffff; }
  #mic.gravando {
    background: #e0243c;
    border-color: #e0243c;
    animation: pulso 1.2s infinite;
  }
  @keyframes pulso {
    0%   { box-shadow: 0 0 0 0 rgba(224,36,60,.55); }
    70%  { box-shadow: 0 0 0 18px rgba(224,36,60,0); }
    100% { box-shadow: 0 0 0 0 rgba(224,36,60,0); }
  }
  #status {
    position: fixed;
    top: 0; left: 0; right: 0;
    text-align: center;
    padding: 10px;
    font-size: 13px;
    color: #ffffff;
    background: rgba(224,36,60,.92);
    display: none;
    z-index: 10;
  }
  #aviso {
    padding: 16px 20px;
    font-size: 15px;
    line-height: 1.5;
    color: #c9c9d2;
    display: none;
  }
  #mensagem {
    display: none;
    margin: 10px 14px 0;
    padding: 12px 14px;
    border: 1px solid #33333b;
    border-radius: 12px;
    font-size: 22px;
    line-height: 1.4;
    color: #ffffff;
    background: #16161c;
  }
</style>
</head>
<body>
  <div id="status"></div>
  <div id="grade">
    <div class="quad" id="q3">3</div>
    <div class="quad" id="q4">4</div>
    <div class="quad" id="q2">2</div>
    <div class="quad" id="q1">1</div>
  </div>
  <div id="aviso"></div>
  <div id="mensagem"></div>
  <div id="texto"></div>
  <footer>
    <button class="mini" id="limpar" title="Limpar texto">🗑</button>
    <button id="mic" title="Falar">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button class="mini" id="copiar" title="Copiar texto">⧉</button>
  </footer>
<script>
(function () {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var texto = document.getElementById('texto');
  var mic = document.getElementById('mic');
  var aviso = document.getElementById('aviso');
  var status = document.getElementById('status');
  var finalTexto = '';
  var ativo = false;
  var rec = null;

  if (!SR) {
    aviso.style.display = 'block';
    aviso.textContent = 'Este navegador não suporta reconhecimento de voz. Tente abrir no Chrome (Android) ou no Safari (iPhone).';
    mic.style.opacity = '0.3';
    return;
  }

  function render(parcial) {
    texto.innerHTML = '';
    if (finalTexto) texto.appendChild(document.createTextNode(finalTexto));
    if (parcial) {
      var s = document.createElement('span');
      s.className = 'parcial';
      s.textContent = (finalTexto ? ' ' : '') + parcial;
      texto.appendChild(s);
    }
    texto.scrollTop = texto.scrollHeight;
  }

  function criar() {
    var r = new SR();
    r.lang = 'pt-BR';
    r.continuous = true;
    r.interimResults = true;
    r.onresult = function (e) {
      var parcial = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          finalTexto = (finalTexto ? finalTexto + ' ' : '') + t.trim();
        } else {
          parcial += t;
        }
      }
      render(parcial.trim());
    };
    r.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        parar();
        status.style.display = 'block';
        status.textContent = 'Permita o acesso ao microfone nas configurações do navegador.';
      }
    };
    r.onend = function () {
      if (ativo) { try { r.start(); } catch (err) {} }
    };
    return r;
  }

  function iniciar() {
    status.style.display = 'none';
    rec = rec || criar();
    try { rec.start(); } catch (err) {}
    ativo = true;
    mic.classList.add('gravando');
  }

  function parar() {
    ativo = false;
    mic.classList.remove('gravando');
    if (rec) { try { rec.stop(); } catch (err) {} }
  }

  mic.addEventListener('click', function () {
    ativo ? parar() : iniciar();
  });

  document.getElementById('limpar').addEventListener('click', function () {
    finalTexto = '';
    render('');
  });

  document.getElementById('copiar').addEventListener('click', function () {
    if (!finalTexto) return;
    if (navigator.clipboard) navigator.clipboard.writeText(finalTexto);
    var b = document.getElementById('copiar');
    b.textContent = '✓';
    setTimeout(function () { b.textContent = '⧉'; }, 1200);
  });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script>
(function () {
  if (typeof mqtt === 'undefined') return; // sem internet pro CDN: página segue funcionando
  var TOPICO = 'ericscvz/tela-preta-k4d9/estado';
  var quads = { 1: 'q1', 2: 'q2', 3: 'q3', 4: 'q4' };
  var msg = document.getElementById('mensagem');

  function corDoTexto(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h.replace(/./g, function (c) { return c + c; });
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#000000' : '#ffffff';
  }

  function aplicar(estado) {
    if (estado.cores) {
      for (var n in quads) {
        var cor = estado.cores[n];
        if (cor) {
          var el = document.getElementById(quads[n]);
          el.style.background = cor;
          el.style.color = corDoTexto(cor);
        }
      }
    }
    if ('mensagem' in estado) {
      if (estado.mensagem) {
        msg.textContent = estado.mensagem;
        msg.style.display = 'block';
      } else {
        msg.style.display = 'none';
      }
    }
  }

  function conectar() {
    var c = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: 'tela-' + Math.random().toString(16).slice(2, 10),
      clean: true,
      reconnectPeriod: 3000
    });
    c.on('connect', function () { c.subscribe(TOPICO); });
    c.on('message', function (t, payload) {
      try { aplicar(JSON.parse(payload.toString())); } catch (e) {}
    });
  }
  conectar();
})();
</script>
<span style="display:none">versao-7-controle</span>
</body>
</html>
