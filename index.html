<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Transcritor de Voz</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    color: #ffffff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  header {
    text-align: center;
    padding: 18px 16px 8px;
    font-size: 15px;
    color: #8a8a93;
  }
  #texto {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px 20px;
    font-size: 22px;
    line-height: 1.5;
    word-wrap: break-word;
  }
  #texto .parcial { color: #6e6e78; }
  #texto:empty::before {
    content: "O que você falar aparece aqui…";
    color: #3a3a42;
  }
  footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 18px 0 34px;
  }
  .mini {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid #33333b;
    background: #141418;
    color: #b9b9c2;
    font-size: 20px;
    cursor: pointer;
  }
  #mic {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 2px solid #ffffff;
    background: #000000;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, border-color .2s;
  }
  #mic svg { width: 40px; height: 40px; fill: #ffffff; }
  #mic.gravando {
    background: #e0243c;
    border-color: #e0243c;
    animation: pulso 1.2s infinite;
  }
  @keyframes pulso {
    0%   { box-shadow: 0 0 0 0 rgba(224,36,60,.55); }
    70%  { box-shadow: 0 0 0 22px rgba(224,36,60,0); }
    100% { box-shadow: 0 0 0 0 rgba(224,36,60,0); }
  }
  #status {
    position: fixed;
    top: 0; left: 0; right: 0;
    text-align: center;
    padding: 10px;
    font-size: 13px;
    color: #e0243c;
    display: none;
    background: rgba(0,0,0,.85);
  }
  #aviso {
    padding: 24px;
    font-size: 17px;
    line-height: 1.6;
    color: #c9c9d2;
    display: none;
  }
</style>
</head>
<body>
  <div id="status"></div>
  <header>Toque no microfone e fale</header>
  <div id="aviso"></div>
  <div id="texto"></div>
  <footer>
    <button class="mini" id="limpar" title="Limpar texto">🗑</button>
    <button id="mic" title="Falar">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button class="mini" id="copiar" title="Copiar texto">⧉</button>
  </footer>
<script>
(function () {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var texto = document.getElementById('texto');
  var mic = document.getElementById('mic');
  var aviso = document.getElementById('aviso');
  var status = document.getElementById('status');
  var finalTexto = '';
  var ativo = false;
  var rec = null;

  if (!SR) {
    aviso.style.display = 'block';
    aviso.textContent = 'Este navegador não suporta reconhecimento de voz. Tente abrir no Chrome (Android) ou no Safari (iPhone).';
    mic.style.opacity = '0.3';
    return;
  }

  function render(parcial) {
    texto.innerHTML = '';
    if (finalTexto) texto.appendChild(document.createTextNode(finalTexto));
    if (parcial) {
      var s = document.createElement('span');
      s.className = 'parcial';
      s.textContent = (finalTexto ? ' ' : '') + parcial;
      texto.appendChild(s);
    }
    texto.scrollTop = texto.scrollHeight;
  }

  function criar() {
    var r = new SR();
    r.lang = 'pt-BR';
    r.continuous = true;
    r.interimResults = true;
    r.onresult = function (e) {
      var parcial = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          finalTexto = (finalTexto ? finalTexto + ' ' : '') + t.trim();
        } else {
          parcial += t;
        }
      }
      render(parcial.trim());
    };
    r.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        parar();
        status.style.display = 'block';
        status.textContent = 'Permita o acesso ao microfone nas configurações do navegador.';
      }
    };
    r.onend = function () {
      if (ativo) { try { r.start(); } catch (err) {} }
    };
    return r;
  }

  function iniciar() {
    status.style.display = 'none';
    rec = rec || criar();
    try { rec.start(); } catch (err) {}
    ativo = true;
    mic.classList.add('gravando');
  }

  function parar() {
    ativo = false;
    mic.classList.remove('gravando');
    if (rec) { try { rec.stop(); } catch (err) {} }
  }

  mic.addEventListener('click', function () {
    ativo ? parar() : iniciar();
  });

  document.getElementById('limpar').addEventListener('click', function () {
    finalTexto = '';
    render('');
  });

  document.getElementById('copiar').addEventListener('click', function () {
    if (!finalTexto) return;
    if (navigator.clipboard) navigator.clipboard.writeText(finalTexto);
    var b = document.getElementById('copiar');
    b.textContent = '✓';
    setTimeout(function () { b.textContent = '⧉'; }, 1200);
  });
})();
</script>
<span style="display:none">versao-5-transcritor</span>
</body>
</html>
