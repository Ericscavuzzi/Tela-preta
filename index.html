<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Transcritor de Voz</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    color: #ffffff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  /* ── Grade de 4 quadrados (metade de cima) ── */
  #grade {
    height: 48%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;
    background: #000000;
    padding: 6px;
    flex-shrink: 0;
  }
  .quad {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    font-weight: 700;
    user-select: none;
  }
  /* 1 = inferior direito, 2 = inferior esquerdo, 3 = superior esquerdo, 4 = superior direito */
  #q3 { grid-column: 1; grid-row: 1; background: #21a55e; color: #ffffff; }
  #q4 { grid-column: 2; grid-row: 1; background: #f5c518; color: #000000; }
  #q2 { grid-column: 1; grid-row: 2; background: #2f6fed; color: #ffffff; }
  #q1 { grid-column: 2; grid-row: 2; background: #e0243c; color: #ffffff; }

  /* ── Painel: retângulo de botões (sob o 2) + onda sonora ao lado ── */
  #painel {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 6px 4px;
    flex-shrink: 0;
  }
  #caixaBotoes {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #141418;
    border: 1px solid #33333b;
    border-radius: 16px;
    padding: 10px 14px;
    width: 100%;          /* retângulo inteiro, com a onda dentro */
  }
  #mic {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid #ffffff;
    background: #000000;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, border-color .2s;
    flex-shrink: 0;
  }
  #mic svg { width: 24px; height: 24px; fill: #ffffff; }
  #mic.gravando {
    background: #e0243c;
    border-color: #e0243c;
    animation: pulso 1.2s infinite;
  }
  @keyframes pulso {
    0%   { box-shadow: 0 0 0 0 rgba(224,36,60,.55); }
    70%  { box-shadow: 0 0 0 14px rgba(224,36,60,0); }
    100% { box-shadow: 0 0 0 0 rgba(224,36,60,0); }
  }
  #onda {
    flex: 1;
    height: 56px;
    min-width: 0;
  }

  /* ── Mensagem remota + transcrição ── */
  #mensagem {
    display: none;
    margin: 8px 14px 0;
    padding: 12px 14px;
    border: 1px solid #33333b;
    border-radius: 12px;
    font-size: 22px;
    line-height: 1.4;
    color: #ffffff;
    background: #16161c;
  }
  #texto {
    flex: 1;
    overflow-y: auto;
    padding: 10px 18px 18px;
    font-size: 20px;
    line-height: 1.5;
    word-wrap: break-word;
  }
  #texto .parcial { color: #6e6e78; }
  #texto:empty::before {
    content: "O que você falar aparece aqui…";
    color: #3a3a42;
    font-size: 15px;
  }
  #status {
    position: fixed;
    top: 0; left: 0; right: 0;
    text-align: center;
    padding: 10px;
    font-size: 13px;
    color: #ffffff;
    background: rgba(224,36,60,.92);
    display: none;
    z-index: 10;
  }
  #aviso {
    padding: 16px 20px;
    font-size: 15px;
    line-height: 1.5;
    color: #c9c9d2;
    display: none;
  }
</style>
</head>
<body>
  <div id="status"></div>
  <div id="grade">
    <div class="quad" id="q3">3</div>
    <div class="quad" id="q4">4</div>
    <div class="quad" id="q2">2</div>
    <div class="quad" id="q1">1</div>
  </div>
  <div id="painel">
    <div id="caixaBotoes">
      <button id="mic" title="Falar">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <canvas id="onda"></canvas>
    </div>
  </div>
  <div id="aviso"></div>
  <div id="mensagem"></div>
  <div id="texto"></div>
<script>
(function () {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var texto = document.getElementById('texto');
  var mic = document.getElementById('mic');
  var aviso = document.getElementById('aviso');
  var status = document.getElementById('status');
  var finalTexto = '';
  var ativo = false;
  var rec = null;

  /* ── Onda sonora ── */
  var canvas = document.getElementById('onda');
  var ctx2d = canvas.getContext('2d');
  var audioCtx = null, analyser = null, stream = null, raf = null, fake = false;
  var alturas = [];

  function dimensionar() {
    canvas.width = canvas.clientWidth * (window.devicePixelRatio || 1);
    canvas.height = canvas.clientHeight * (window.devicePixelRatio || 1);
  }
  window.addEventListener('resize', dimensionar);

  function desenharBarras(niveis) {
    ctx2d.clearRect(0, 0, canvas.width, canvas.height);
    var n = niveis.length;
    var larg = canvas.width / n;
    var meio = canvas.height / 2;
    ctx2d.fillStyle = '#ffffff';
    for (var i = 0; i < n; i++) {
      var h = Math.max(canvas.height * 0.04, niveis[i] * canvas.height * 0.9);
      var x = i * larg + larg * 0.25;
      ctx2d.fillRect(x, meio - h / 2, larg * 0.5, h);
    }
  }

  function loop() {
    var N = 28;
    var niveis = [];
    if (analyser && !fake) {
      var dados = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dados);
      for (var i = 0; i < N; i++) {
        var idx = Math.floor(i * dados.length / N);
        niveis.push(dados[idx] / 255);
      }
    } else {
      for (var j = 0; j < N; j++) {
        var alvo = ativo ? Math.random() * 0.8 : 0;
        alturas[j] = (alturas[j] || 0) * 0.7 + alvo * 0.3;
        niveis.push(alturas[j]);
      }
    }
    desenharBarras(niveis);
    raf = requestAnimationFrame(loop);
  }

  function ligarOnda() {
    dimensionar();
    if (raf) cancelAnimationFrame(raf);
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
        stream = s;
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var src = audioCtx.createMediaStreamSource(s);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        analyser.smoothingTimeConstant = 0.6;
        src.connect(analyser);
        fake = false;
        loop();
      }).catch(function () { fake = true; loop(); });
    } else {
      fake = true;
      loop();
    }
  }

  function desligarOnda() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    analyser = null;
    ctx2d.clearRect(0, 0, canvas.width, canvas.height);
    desenharBarras(new Array(28).fill(0));
  }

  dimensionar();
  desenharBarras(new Array(28).fill(0));

  /* ── Transcrição ── */
  if (!SR) {
    aviso.style.display = 'block';
    aviso.textContent = 'Este navegador não suporta reconhecimento de voz. Tente abrir no Chrome (Android) ou no Safari (iPhone).';
    mic.style.opacity = '0.3';
    return;
  }

  function render(parcial) {
    texto.innerHTML = '';
    if (finalTexto) texto.appendChild(document.createTextNode(finalTexto));
    if (parcial) {
      var s = document.createElement('span');
      s.className = 'parcial';
      s.textContent = (finalTexto ? ' ' : '') + parcial;
      texto.appendChild(s);
    }
    texto.scrollTop = texto.scrollHeight;
  }

  function criar() {
    var r = new SR();
    r.lang = 'pt-BR';
    r.continuous = true;
    r.interimResults = true;
    r.onresult = function (e) {
      var parcial = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          finalTexto = (finalTexto ? finalTexto + ' ' : '') + t.trim();
        } else {
          parcial += t;
        }
      }
      render(parcial.trim());
    };
    r.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        parar();
        status.style.display = 'block';
        status.textContent = 'Permita o acesso ao microfone nas configurações do navegador.';
      }
    };
    r.onend = function () {
      if (ativo) { try { r.start(); } catch (err) {} }
    };
    return r;
  }

  function iniciar() {
    status.style.display = 'none';
    rec = rec || criar();
    try { rec.start(); } catch (err) {}
    ativo = true;
    mic.classList.add('gravando');
    ligarOnda();
  }

  function parar() {
    ativo = false;
    mic.classList.remove('gravando');
    if (rec) { try { rec.stop(); } catch (err) {} }
    desligarOnda();
  }

  mic.addEventListener('click', function () {
    ativo ? parar() : iniciar();
  });

})();
</script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script>
(function () {
  if (typeof mqtt === 'undefined') return;
  var TOPICO = 'ericscvz/tela-preta-k4d9/estado';
  var quads = { 1: 'q1', 2: 'q2', 3: 'q3', 4: 'q4' };
  var msg = document.getElementById('mensagem');

  function corDoTexto(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h.replace(/./g, function (c) { return c + c; });
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#000000' : '#ffffff';
  }

  function aplicar(estado) {
    if (estado.cores) {
      for (var n in quads) {
        var cor = estado.cores[n];
        if (cor) {
          var el = document.getElementById(quads[n]);
          el.style.background = cor;
          el.style.color = corDoTexto(cor);
        }
      }
    }
    if ('mensagem' in estado) {
      if (estado.mensagem) {
        msg.textContent = estado.mensagem;
        msg.style.display = 'block';
      } else {
        msg.style.display = 'none';
      }
    }
  }

  var c = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
    clientId: 'tela-' + Math.random().toString(16).slice(2, 10),
    clean: true,
    reconnectPeriod: 3000
  });
  c.on('connect', function () { c.subscribe(TOPICO); });
  c.on('message', function (t, payload) {
    try { aplicar(JSON.parse(payload.toString())); } catch (e) {}
  });
})();
</script>
<span style="display:none">versao-9-retangulo</span>
</body>
</html>
